<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora — Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin-styles.css">
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="sidebar"></aside>

        <!-- Main Content -->
        <div class="main-wrapper">
            <!-- Top Navigation -->
            <nav id="navbar" class="navbar"></nav>

            <!-- Page Content -->
            <main id="content" class="content">
                <!-- Pages will render here -->
            </main>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div id="loader" class="loader" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- Confirmation Dialog -->
    <div id="confirmDialog" class="confirm-dialog" style="display: none;">
        <div class="confirm-content">
            <p id="confirmMessage"></p>
            <div class="confirm-actions">
                <button id="confirmYes" class="btn btn-danger">Confirm</button>
                <button id="confirmNo" class="btn btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="details-modal" style="display: none;">
        <div class="details-modal-content">
            <div class="details-modal-header">
                <h2 id="detailsTitle"></h2>
                <button class="close-modal-btn" onclick="document.getElementById('detailsModal').style.display = 'none';">&times;</button>
            </div>
            <div id="detailsBody" class="details-modal-body"></div>
            <div class="details-modal-footer">
                <button class="btn btn-secondary" onclick="document.getElementById('detailsModal').style.display = 'none';">Close</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="services/api.js"></script>
    <script src="components/sidebar.js"></script>
    <script src="components/navbar.js"></script>
    <script src="components/table.js"></script>
    <script src="pages/dashboard.js"></script>
    <script src="pages/users.js"></script>
    <script src="pages/qr-codes.js"></script>
    <script src="pages/activity.js"></script>
    <script src="admin.js"></script>
</body>
</html>
