<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knock Knock — Nexora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --accent:#6C63FF; --bg:#0f0f13; --surface:#17171f;
            --surface2:#1e1e28; --border:rgba(255,255,255,0.07);
            --text:#f0f0f5; --text-muted:#7b7b8f; --text-subtle:#3f3f52;
            --danger:#ff5c72; --success:#3ecf8e; --blue:#378ADD;
            --radius:14px; --radius-sm:9px;
        }
        body {
            font-family:'DM Sans',sans-serif;
            background:var(--bg); color:var(--text);
            min-height:100vh; display:flex;
            align-items:center; justify-content:center;
            padding:1.5rem;
        }
        .container {
            width:100%; max-width:480px;
            animation:fadeUp 0.45s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes fadeUp {
            from{opacity:0;transform:translateY(20px)}
            to{opacity:1;transform:translateY(0)}
        }
        .card {
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:20px;
            padding:2rem 1.75rem;
            text-align:center;
        }

        /* ── Status badge ── */
        .status-badge {
            display:inline-flex; align-items:center; gap:8px;
            background:rgba(55,138,221,0.1);
            border:1px solid rgba(55,138,221,0.2);
            border-radius:99px; padding:6px 16px;
            font-size:13px; color:var(--blue);
            margin-bottom:1.5rem;
        }
        .status-dot {
            width:8px; height:8px; border-radius:50%;
            background:var(--blue);
            box-shadow:0 0 8px var(--blue);
            animation:pulse 2s ease infinite;
        }
        @keyframes pulse {
            0%,100%{opacity:1} 50%{opacity:0.4}
        }

        /* ── Logo ── */
        .brand {
            font-family:'DM Serif Display',serif;
            font-size:22px; color:var(--text);
            margin-bottom:0.5rem;
        }
        .brand span { color:var(--accent); }

        h1 {
            font-family:'DM Serif Display',serif;
            font-size:28px; font-weight:400;
            color:var(--text); margin-bottom:8px;
        }
        .subtitle {
            font-size:14px; color:var(--text-muted);
            margin-bottom:2rem; line-height:1.6;
        }

        /* ── Video area ── */
        .video-grid {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px; margin-bottom:1.5rem;
        }
        .video-box {
            background:var(--surface2);
            border:1px solid var(--border);
            border-radius:var(--radius);
            aspect-ratio:4/3;
            position:relative;
            overflow:hidden;
            display:flex; align-items:center; justify-content:center;
        }
        .video-box video {
            width:100%; height:100%;
            object-fit:cover; border-radius:var(--radius);
        }
        .video-label {
            position:absolute; bottom:8px; left:10px;
            font-size:11px; color:#fff;
            background:rgba(0,0,0,0.5);
            padding:2px 8px; border-radius:99px;
        }
        .video-placeholder {
            display:flex; flex-direction:column;
            align-items:center; gap:8px;
            color:var(--text-subtle); font-size:13px;
        }
        .video-placeholder svg {
            width:32px; height:32px;
            stroke:currentColor; fill:none;
            stroke-width:1.5;
        }

        /* ── Call controls ── */
        .controls {
            display:flex; align-items:center;
            justify-content:center; gap:16px;
            margin-bottom:1.5rem;
        }
        .ctrl-btn {
            width:48px; height:48px; border-radius:50%;
            border:none; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            transition:all 0.2s;
        }
        .ctrl-btn svg {
            width:20px; height:20px;
            stroke:currentColor; fill:none;
            stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
        }
        .ctrl-btn.mute {
            background:var(--surface2);
            border:1px solid var(--border);
            color:var(--text-muted);
        }
        .ctrl-btn.mute:hover { border-color:rgba(255,255,255,0.2); color:var(--text); }
        .ctrl-btn.mute.active { background:rgba(255,92,114,0.15); color:var(--danger); border-color:rgba(255,92,114,0.3); }
        .ctrl-btn.end {
            width:56px; height:56px;
            background:var(--danger); color:#fff;
        }
        .ctrl-btn.end:hover { background:#e04060; transform:scale(1.05); }

        /* ── Timer ── */
        .timer {
            font-family:'DM Sans',sans-serif;
            font-size:13px; color:var(--text-muted);
            margin-bottom:1.5rem;
        }
        .timer span {
            font-weight:600; color:var(--text);
            font-variant-numeric:tabular-nums;
        }

        /* ── Waiting state ── */
        .waiting-state { padding:1rem 0; }
        .waiting-icon {
            width:64px; height:64px; border-radius:50%;
            background:rgba(55,138,221,0.1);
            border:1px solid rgba(55,138,221,0.2);
            display:flex; align-items:center; justify-content:center;
            margin:0 auto 1.25rem;
            animation:float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)}
        }
        .waiting-icon svg {
            width:28px; height:28px;
            stroke:var(--blue); fill:none;
            stroke-width:1.8;
        }
        .waiting-state h2 {
            font-family:'DM Serif Display',serif;
            font-size:22px; font-weight:400;
            color:var(--text); margin-bottom:8px;
        }
        .waiting-state p {
            font-size:13.5px; color:var(--text-muted);
            line-height:1.6; margin-bottom:1.5rem;
        }

        /* ── Session info ── */
        .session-info {
            background:var(--surface2);
            border:1px solid var(--border);
            border-radius:var(--radius-sm);
            padding:1rem 1.25rem;
            margin-bottom:1.5rem;
            text-align:left;
        }
        .info-row {
            display:flex; justify-content:space-between;
            align-items:center; font-size:13px;
            padding:5px 0;
            border-bottom:1px solid var(--border);
        }
        .info-row:last-child { border-bottom:none; }
        .info-label { color:var(--text-muted); }
        .info-val   { color:var(--text); font-weight:500; }

        /* ── Buttons ── */
        .btn-primary {
            width:100%; padding:13px;
            background:var(--blue); color:#fff;
            border:none; border-radius:var(--radius-sm);
            font-family:'DM Sans',sans-serif;
            font-size:14.5px; font-weight:500;
            cursor:pointer; display:flex;
            align-items:center; justify-content:center; gap:8px;
            transition:opacity 0.2s, transform 0.1s;
            margin-bottom:10px;
        }
        .btn-primary:hover   { opacity:0.88; }
        .btn-primary:active  { transform:scale(0.98); }
        .btn-primary.loading { opacity:0.6; pointer-events:none; }
        .btn-primary svg {
            width:16px; height:16px;
            stroke:currentColor; fill:none;
            stroke-width:2;
        }
        .btn-secondary {
            width:100%; padding:11px;
            background:none;
            border:1px solid var(--border);
            border-radius:var(--radius-sm);
            color:var(--text-muted);
            font-family:'DM Sans',sans-serif;
            font-size:13.5px; cursor:pointer;
            transition:border-color 0.2s, color 0.2s;
        }
        .btn-secondary:hover {
            border-color:rgba(255,255,255,0.15);
            color:var(--text);
        }

        /* ── Error / expired ── */
        .error-state {
            padding:1rem 0;
        }
        .error-icon {
            width:56px; height:56px; border-radius:50%;
            background:rgba(255,92,114,0.1);
            display:flex; align-items:center; justify-content:center;
            margin:0 auto 1.25rem;
        }
        .error-icon svg {
            width:24px; height:24px;
            stroke:var(--danger); fill:none; stroke-width:2;
        }
        .error-state h2 {
            font-family:'DM Serif Display',serif;
            font-size:22px; font-weight:400;
            color:var(--text); margin-bottom:8px;
        }
        .error-state p {
            font-size:13.5px; color:var(--text-muted);
            line-height:1.6;
        }

        #message {
            font-size:13px; padding:10px 13px;
            border-radius:var(--radius-sm);
            margin-top:12px; display:none;
        }
        #message.error   { display:block; background:rgba(255,92,114,0.1); border:1px solid rgba(255,92,114,0.25); color:var(--danger); }
        #message.success { display:block; background:rgba(62,207,142,0.1); border:1px solid rgba(62,207,142,0.25); color:var(--success); }
    </style>
</head>
<body>

<div class="container">
    <div class="card">

        <!-- Brand -->
        <div class="brand" style="margin-bottom:1.5rem;">
            Nexo<span>ra</span>
        </div>

        <!-- Loading State -->
        <div id="loadingState">
            <div class="status-badge">
                <span class="status-dot"></span>
                Connecting...
            </div>
            <p style="color:var(--text-muted); font-size:14px;">
                Verifying session...
            </p>
        </div>

        <!-- Error / Expired State -->
        <div id="errorState" style="display:none;">
            <div class="error-state">
                <div class="error-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                </div>
                <h2>Session Unavailable</h2>
                <p id="errorMsg">This session has expired or doesn't exist.</p>
            </div>
        </div>

        <!-- Waiting for host State -->
        <div id="waitingState" style="display:none;">
            <div class="status-badge">
                <span class="status-dot"></span>
                Session Active
            </div>

            <div class="waiting-state">
                <div class="waiting-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.87v6.26a1 1 0 0 1-1.447.9L15 14"/>
                        <rect x="3" y="8" width="12" height="8" rx="2"/>
                    </svg>
                </div>
                <h2 id="sessionLabelText">Knock Knock</h2>
                <p>Someone is waiting to connect with you via video call.</p>

                <!-- Session info -->
                <div class="session-info">
                    <div class="info-row">
                        <span class="info-label">Session</span>
                        <span class="info-val" id="infoLabel">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Expires at</span>
                        <span class="info-val" id="infoExpiry">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Duration</span>
                        <span class="info-val" id="infoDuration">—</span>
                    </div>
                </div>

                <!-- Join button -->
                <button class="btn-primary" id="joinCallBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.87v6.26a1 1 0 0 1-1.447.9L15 14"/>
                        <rect x="3" y="8" width="12" height="8" rx="2"/>
                    </svg>
                    Join Video Call
                </button>

                <button class="btn-secondary" id="declineBtn">
                    Decline
                </button>
            </div>
        </div>

        <!-- Active Call State -->
        <div id="callState" style="display:none;">
            <div class="status-badge" style="margin-bottom:1rem;">
                <span class="status-dot"></span>
                Call in Progress
            </div>

            <!-- Video grid -->
            <div class="video-grid">
                <!-- Remote video (host) -->
                <div class="video-box">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div id="remoteVideoPlaceholder" class="video-placeholder">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <span>Host</span>
                    </div>
                    <span class="video-label">Host</span>
                </div>

                <!-- Local video (visitor) -->
                <div class="video-box">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div id="localVideoPlaceholder" class="video-placeholder">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <span>You</span>
                    </div>
                    <span class="video-label">You</span>
                </div>
            </div>

            <!-- Timer -->
            <div class="timer">
                Call duration: <span id="callTimer">00:00</span>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="ctrl-btn mute" id="muteBtn" title="Mute">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
                    </svg>
                </button>

                <button class="ctrl-btn end" id="endCallBtn" title="End Call">
                    <svg viewBox="0 0 24 24">
                        <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.42 19.42 0 0 1 4.26 8.91a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 3.17 0h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.15 7.91"/>
                        <line x1="23" y1="1" x2="1" y2="23"/>
                    </svg>
                </button>

                <button class="ctrl-btn mute" id="videoBtn" title="Toggle video">
                    <svg viewBox="0 0 24 24">
                        <path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.87v6.26a1 1 0 0 1-1.447.9L15 14"/>
                        <rect x="3" y="8" width="12" height="8" rx="2"/>
                    </svg>
                </button>
            </div>
        </div>

        <p id="message"></p>

    </div>
</div>

<!-- PeerJS for WebRTC -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script src="config.js"></script>
    <script>
    /* ── Get token from URL ── */
    const urlParams    = new URLSearchParams(window.location.search);
    const sessionToken = urlParams.get('token');

    /* ── State ── */
    let localStream  = null;
    let peer         = null;
    let currentCall  = null;
    let socket       = null;
    let timerInterval = null;
    let callSeconds  = 0;
    let isMuted      = false;
    let isVideoOff   = false;

    /* ── UI helpers ── */
    function showState(stateId) {
        ['loadingState', 'errorState', 'waitingState', 'callState']
            .forEach(id => {
                document.getElementById(id).style.display =
                    id === stateId ? 'block' : 'none';
            });
    }

    function showMessage(text, type) {
        const msg       = document.getElementById('message');
        msg.textContent = text;
        msg.className   = type;
    }

    /* ── Step 1: Verify session token ── */
    async function verifySession() {
        if (!sessionToken) {
            showState('errorState');
            document.getElementById('errorMsg').textContent =
                'No session token found in URL.';
            return;
        }

        try {
            const response = await fetch(
                `${API}/knockknock/join/${sessionToken}`
            );
            const data = await response.json();

            if (data.success) {
                // ── Show waiting state ──
                showState('waitingState');
                document.getElementById('sessionLabelText').textContent =
                    data.sessionLabel || 'Knock Knock';
                document.getElementById('infoLabel').textContent =
                    data.sessionLabel || '—';
                document.getElementById('infoExpiry').textContent =
                    new Date(data.expiresAt).toLocaleTimeString([],
                        { hour:'2-digit', minute:'2-digit' });
                document.getElementById('infoDuration').textContent =
                    data.durationMinutes
                        ? `${data.durationMinutes} minutes`
                        : '—';
            } else {
                showState('errorState');
                document.getElementById('errorMsg').textContent =
                    data.message || 'Session not found or expired.';
            }

        } catch (err) {
            console.error(err);
            showState('errorState');
            document.getElementById('errorMsg').textContent =
                'Could not connect to server.';
        }
    }

    /* ── Step 2: Join Call ── */
    document.getElementById('joinCallBtn').addEventListener('click', async () => {
        const btn = document.getElementById('joinCallBtn');
        btn.classList.add('loading');
        btn.textContent = 'Connecting...';

        try {
            /* Get camera + mic */
            localStream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: true
            });

            const localVideo = document.getElementById('localVideo');
            localVideo.srcObject = localStream;
            document.getElementById('localVideoPlaceholder').style.display = 'none';

            /* Connect to Socket.IO signaling server */
            socket = io(`http://${SERVER_IP}:5000`);

            socket.on('connect', () => {
                console.log('Connected to signaling server');

                /* Join the room */
                socket.emit('join-room', {
                    sessionToken,
                    role: 'visitor'
                });
            });

            /* Host sends offer */
            socket.on('receive-offer', async ({ offer }) => {
                console.log('Received offer from host');

                peer = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                });

                /* Add local stream */
                localStream.getTracks().forEach(track => {
                    peer.addTrack(track, localStream);
                });

                /* Handle remote stream */
                peer.ontrack = (event) => {
                    const remoteVideo = document.getElementById('remoteVideo');
                    remoteVideo.srcObject = event.streams[0];
                    document.getElementById('remoteVideoPlaceholder').style.display = 'none';
                };

                /* ICE candidates */
                peer.onicecandidate = (event) => {
                    if (event.candidate) {
                        socket.emit('send-ice-candidate', {
                            sessionToken,
                            candidate: event.candidate
                        });
                    }
                };

                /* Set remote description and answer */
                await peer.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await peer.createAnswer();
                await peer.setLocalDescription(answer);

                socket.emit('send-answer', { sessionToken, answer });

                /* Show call UI */
                showState('callState');
                startTimer();
            });

            /* Receive ICE candidates */
            socket.on('receive-ice-candidate', async ({ candidate }) => {
                if (peer && candidate) {
                    await peer.addIceCandidate(new RTCIceCandidate(candidate));
                }
            });

            /* Host ended call */
            socket.on('call-ended', () => {
                endCall();
                showMessage('Host ended the call.', 'error');
            });

        } catch (err) {
            console.error('Error joining call:', err);
            btn.classList.remove('loading');
            btn.innerHTML = `
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.87v6.26a1 1 0 0 1-1.447.9L15 14"/>
                    <rect x="3" y="8" width="12" height="8" rx="2"/>
                </svg>
                Join Video Call`;
            showMessage('Could not access camera/microphone.', 'error');
        }
    });

    /* ── Decline ── */
    document.getElementById('declineBtn').addEventListener('click', () => {
        window.close();
        /* Fallback if window.close() blocked */
        showState('errorState');
        document.getElementById('errorMsg').textContent =
            'You declined the call.';
    });

    /* ── Mute toggle ── */
    document.getElementById('muteBtn').addEventListener('click', () => {
        if (!localStream) return;
        isMuted = !isMuted;
        localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
        document.getElementById('muteBtn').classList.toggle('active', isMuted);
    });

    /* ── Video toggle ── */
    document.getElementById('videoBtn').addEventListener('click', () => {
        if (!localStream) return;
        isVideoOff = !isVideoOff;
        localStream.getVideoTracks().forEach(t => t.enabled = !isVideoOff);
        document.getElementById('videoBtn').classList.toggle('active', isVideoOff);
    });

    /* ── End call button ── */
    document.getElementById('endCallBtn').addEventListener('click', () => {
        if (socket) socket.emit('end-call', { sessionToken });
        endCall();
    });

    /* ── End call logic ── */
    function endCall() {
        if (timerInterval) clearInterval(timerInterval);
        if (localStream)   localStream.getTracks().forEach(t => t.stop());
        if (peer)          peer.close();
        if (socket)        socket.disconnect();

        showState('errorState');
        document.getElementById('errorMsg').textContent =
            'Call ended. You can close this window.';
    }

    /* ── Timer ── */
    function startTimer() {
        callSeconds = 0;
        timerInterval = setInterval(() => {
            callSeconds++;
            const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
            const s = String(callSeconds % 60).padStart(2, '0');
            document.getElementById('callTimer').textContent = `${m}:${s}`;
        }, 1000);
    }

    /* ── Start ── */
    verifySession();
</script>

</body>
</html>
