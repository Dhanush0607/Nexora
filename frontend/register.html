<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --accent:#6C63FF; --accent-dark:#5549e8;
            --accent-glow:rgba(108,99,255,0.18);
            --bg:#0f0f13; --surface:#17171f; --surface2:#1e1e28;
            --border:rgba(255,255,255,0.07);
            --border-focus:rgba(108,99,255,0.6);
            --text:#f0f0f5; --text-muted:#7b7b8f; --text-subtle:#3f3f52;
            --danger:#ff5c72; --success:#3ecf8e;
            --radius:14px; --radius-sm:9px;
        }
        body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; overflow:hidden; }
        body::before { content:''; position:fixed; top:-200px; left:-150px; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle,rgba(108,99,255,0.12) 0%,transparent 70%); pointer-events:none; z-index:0; }
        body::after  { content:''; position:fixed; bottom:-180px; right:-130px; width:450px; height:450px; border-radius:50%; background:radial-gradient(circle,rgba(62,207,142,0.07) 0%,transparent 70%); pointer-events:none; z-index:0; }
        .login-container { width:100%; max-width:400px; position:relative; z-index:1; animation:slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both; }
        @keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
        .card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:2.5rem 2.25rem; }
        .header { margin-bottom:2rem; }
        .logo { width:42px; height:42px; background:var(--accent); border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:1.25rem; }
        .logo svg { width:22px; height:22px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .header h1 { font-family:'DM Serif Display',serif; font-size:26px; font-weight:400; color:var(--text); letter-spacing:-0.3px; margin-bottom:4px; }
        .header p  { font-size:13.5px; color:var(--text-muted); }
        .field { margin-bottom:1rem; }
        .field label { display:block; font-size:12.5px; font-weight:500; color:var(--text-muted); margin-bottom:7px; letter-spacing:0.3px; text-transform:uppercase; }
        .input-wrap { position:relative; }
        .input-wrap .icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-subtle); display:flex; pointer-events:none; transition:color 0.2s; }
        .input-wrap .icon svg { width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
        .input-wrap input { width:100%; padding:12px 14px 12px 44px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; outline:none; transition:border-color 0.2s,box-shadow 0.2s; }
        .input-wrap input::placeholder { color:var(--text-subtle); }
        .input-wrap input:focus { border-color:var(--border-focus); box-shadow:0 0 0 3px var(--accent-glow); }
        .input-wrap:focus-within .icon { color:var(--accent); }
        .toggle-eye { position:absolute; right:13px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-subtle); padding:4px; display:flex; align-items:center; transition:color 0.2s; }
        .toggle-eye:hover { color:var(--text-muted); }
        .toggle-eye svg { width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
        .strength-bar { display:flex; gap:4px; margin-top:8px; }
        .strength-bar span { flex:1; height:3px; border-radius:99px; background:var(--surface2); border:1px solid var(--border); transition:background 0.3s; }
        .strength-bar span.weak   { background:var(--danger); }
        .strength-bar span.medium { background:#f59e0b; }
        .strength-bar span.strong { background:var(--success); }
        .strength-label { font-size:11.5px; color:var(--text-muted); margin-top:5px; }
        .btn-primary { width:100%; padding:13px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius-sm); font-family:'DM Sans',sans-serif; font-size:14.5px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; margin-top:0.5rem; transition:background 0.2s,transform 0.1s,box-shadow 0.2s; }
        .btn-primary:hover { background:var(--accent-dark); box-shadow:0 4px 20px rgba(108,99,255,0.35); }
        .btn-primary:active { transform:scale(0.98); }
        .btn-primary svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:transform 0.2s; }
        .btn-primary:hover svg { transform:translateX(2px); }
        .btn-primary.loading { opacity:0.7; pointer-events:none; }
        .divider { display:flex; align-items:center; gap:12px; margin:1.25rem 0; color:var(--text-subtle); font-size:12px; }
        .divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }
        .btn-google { width:100%; padding:12px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:border-color 0.2s,background 0.2s,opacity 0.2s; }
        .btn-google:hover { border-color:rgba(255,255,255,0.15); background:rgba(255,255,255,0.04); }
        .btn-google:active { transform:scale(0.98); }
        .btn-google.loading { opacity:0.6; pointer-events:none; }
        /* Hide GIS widget; we use our own button */
        #g_id_onload { display:none; }
        #message { margin-top:14px; font-size:13px; padding:10px 13px; border-radius:var(--radius-sm); display:none; }
        #message.error   { display:block; background:rgba(255,92,114,0.1);  border:1px solid rgba(255,92,114,0.25);  color:var(--danger); }
        #message.success { display:block; background:rgba(62,207,142,0.1);  border:1px solid rgba(62,207,142,0.25);  color:var(--success); }
        .login-line { text-align:center; margin-top:1.5rem; font-size:13px; color:var(--text-muted); }
        .login-line a { color:var(--accent); text-decoration:none; font-weight:500; }
        .login-line a:hover { text-decoration:underline; }
    </style>
</head>
<body>

    

    <div class="login-container">
        <div class="card">
            <div class="header">
                <div class="logo">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                </div>
                <h1>Create account</h1>
                <p>Join Nexora — it only takes a minute</p>
            </div>

            <!-- Google sign-up first (above the form) -->
            <button class="btn-google" id="googleBtn" type="button">
                <svg width="17" height="17" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
                    <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                    <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
                </svg>
                Sign up with Google
            </button>

            <div class="divider">or sign up with email</div>

            <form id="registerForm" novalidate>
                <div class="field">
                    <label for="fullName">Full name</label>
                    <div class="input-wrap">
                        <span class="icon">
                            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <input type="text" id="fullName" placeholder="John Doe" autocomplete="name" required>
                    </div>
                </div>

                <div class="field">
                    <label for="email">Email address</label>
                    <div class="input-wrap">
                        <span class="icon">
                            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
                        </span>
                        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <span class="icon">
                            <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" required>
                        <button type="button" class="toggle-eye" id="eyeBtn" aria-label="Show password">
                            <svg id="eyeIcon" viewBox="0 0 24 24">
                                <path d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <div class="strength-bar">
                        <span id="s1"></span>
                        <span id="s2"></span>
                        <span id="s3"></span>
                        <span id="s4"></span>
                    </div>
                    <p class="strength-label" id="strengthLabel"></p>
                </div>

                <button type="submit" class="btn-primary">
                    Create account
                    <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>

            <p id="message"></p>

            <p class="login-line">Already have an account? <a href="login.html">Sign in</a></p>
        </div>
    </div>

    <script>
    /* ── Password toggle ── */
    const eyeBtn        = document.getElementById('eyeBtn');
    const eyeIcon       = document.getElementById('eyeIcon');
    const passwordInput = document.getElementById('password');
    let visible = false;

    const eyeOpen   = `<path d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z"/>
                       <circle cx="12" cy="12" r="3"/>`;
    const eyeClosed = `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8
                       a18.45 18.45 0 015.06-5.94"/>
                       <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8
                       a18.5 18.5 0 01-2.16 3.19"/>
                       <line x1="1" y1="1" x2="23" y2="23"/>`;

    eyeBtn.addEventListener('click', () => {
        visible            = !visible;
        passwordInput.type = visible ? 'text' : 'password';
        eyeIcon.innerHTML  = visible ? eyeClosed : eyeOpen;
        eyeBtn.setAttribute('aria-label', visible ? 'Hide password' : 'Show password');
    });

    /* ── Password strength ── */
    const segments = [
        document.getElementById('s1'),
        document.getElementById('s2'),
        document.getElementById('s3'),
        document.getElementById('s4')
    ];
    const strengthLabel = document.getElementById('strengthLabel');

    function getStrength(pw) {
        let score = 0;
        if (pw.length >= 8)          score++;
        if (/[A-Z]/.test(pw))        score++;
        if (/[0-9]/.test(pw))        score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;
        return score;
    }

    passwordInput.addEventListener('input', () => {
        const pw      = passwordInput.value;
        const score   = pw.length === 0 ? 0 : getStrength(pw);
        const labels  = ['', 'Weak', 'Fair', 'Good', 'Strong'];
        const classes = ['', 'weak', 'medium', 'medium', 'strong'];
        segments.forEach((s, i) => { s.className = i < score ? classes[score] : ''; });
        strengthLabel.textContent = pw.length ? labels[score] : '';
    });

    /* ── Message helper ── */
    function showMessage(text, type) {
        const msg       = document.getElementById('message');
        msg.textContent = text;
        msg.className   = type;
    }

    /* ── Google callback ── */
    async function handleGoogleRegister(googleResponse) {
        const btn = document.getElementById('googleBtn');
        btn.classList.add('loading');
        btn.textContent = 'Creating account…';

        try {
            const response = await fetch('http://localhost:5000/api/auth/google', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ idToken: googleResponse.credential }),
            });

            const data = await response.json();

            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                showMessage('Account created! Redirecting…', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 700);
            } else {
                showMessage(data.message || 'Google sign-up failed.', 'error');
                resetGoogleBtn();
            }

        } catch (err) {
            console.error(err);
            showMessage('Server error. Please try again.', 'error');
            resetGoogleBtn();
        }
    }

    function resetGoogleBtn() {
        const btn = document.getElementById('googleBtn');
        btn.classList.remove('loading');
        btn.innerHTML = `
            <svg width="17" height="17" viewBox="0 0 18 18">
                <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
                <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
            </svg>
            Sign up with Google`;
    }

    /* ── Initialize Google Sign-In ── */
    window.onload = function() {
        if (typeof google !== 'undefined') {
            google.accounts.id.initialize({
                client_id:            '354097366285-lq2cbdgqmimj64orutdplq0nr2ibfvtb.apps.googleusercontent.com',
                callback:             handleGoogleRegister,  // ← Different callback from login
                auto_select:          false,
                use_fedcm_for_prompt: false,
            });

            // Render Google button
            google.accounts.id.renderButton(
                document.getElementById('googleBtn'),
                {
                    type:  'standard',
                    theme: 'filled_black',
                    size:  'large',
                    width: 358,
                    text:  'signup_with',   // ← "Sign up with Google" text
                }
            );
        }
    };
</script>

    <!-- email/password form logic -->
    <script src="register.js"></script>
</body>
</html>
